<head>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; color: #333333; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-y: scroll; }
        .container { max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 40px; }
        
        /* ШАПКА И МЕНЮ СЕРОГО ЦВЕТА ИЗ ВАШЕЙ ВЕРСИИ - НЕИЗМЕННЫ ПОВСЮДУ */
        header { background: #f4f4f4; width: 100%; padding: 35px 0 28px 0; border-bottom: 1px solid #e2e2e2; text-align: center; }
        header h1 { font-size: 1.5rem; margin: 0 0 6px 0; font-weight: 500; letter-spacing: -0.3px; color: #111111; }
        header .subtitle { color: #888888; font-size: 0.85rem; margin: 0 0 24px 0; letter-spacing: 0.5px; font-weight: 400; }
        
        nav { display: flex; justify-content: center; gap: 35px; }
        nav a { text-decoration: none; color: #888888; font-size: 1.1rem; font-weight: 400; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: color 0.2s ease, border-color 0.2s ease; }
        nav a.active, nav a:hover { color: #111111; border-color: #111111; }
        
        /* Главный контент */
        main { flex: 1; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .page-wrapper { width: 100%; padding: 25px 0 120px 0; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        /* ПОДЗАГОЛОВОК СТАЛ МЕНЬШЕ, ВЫШЕ И СТРОГО ПО ЦЕНТРУ (КООРДИНАТЫ ОДИН В ОДИН) */
        
        /* Сетка в 3 колонки смещена ниже под заголовок */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 50px 40px; width: 100%; padding-top: 20px; }
        
        /* Карточка проекта — ИЗМЕНЕНО: теперь это единая серая плашка с рамкой */
        .project-card { 
            text-decoration: none; 
            color: inherit; 
            display: flex; 
            flex-direction: column; 
            text-align: center; 
            background-color: #ededed; /* Серый фон подложки */
            border: 1px solid #e5e5e5;  /* Внешний контур плашки */
            border-radius: 16px;       /* Единое скругление углов */
            overflow: hidden;          /* Скрывает острые углы видео внутри рамки */
            transition: transform 0.2s ease, border-color 0.2s ease; 
        }
        .project-card:hover { 
            transform: translateY(-4px); 
            border-color: #b5b5b5; 
        }
        
        /* Заглушка для картинок/гифок — ИЗМЕНЕНО: убрана двойная рамка, скругление только сверху */
        .project-media-box { 
            width: 100%; 
            aspect-ratio: 4 / 2; 
            border-radius: 15px 15px 0 0; /* Скруглены только верхние углы */
            overflow: hidden; 
            background-color: #f5f5f5; 
            border-bottom: 1px solid #e5e5e5; /* Линия-разделитель между видео и текстом */
        }
        .project-media-box video { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }

        
        /* Текстовые названия — ИЗМЕНЕНО: добавлены аккуратные внутренние отступы внутри плашки */
        .project-info { padding: 18px 15px 20px 15px; text-align: center; }
        .project-title { font-size: 1.1rem; font-weight: 500; color: #111111; margin: 0; line-height: 1.3; }

        /* ФУТЕР */
        footer { background: #e5e5e5; color: #555555; padding: 25px 0; font-size: 0.85rem; width: 100%; margin-top: auto; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; }
        .footer-left { font-weight: 400; color: #666666; }
        .footer-right { display: flex; align-items: center; gap: 15px; }
        .footer-right span { font-weight: 500; color: #333333; margin-right: 5px; letter-spacing: 0.3px; }
        
        .social-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #222222; border-radius: 50%; color: #ffffff; transition: background 0.2s ease, transform 0.2s ease; text-decoration: none; }
        .social-icon:hover { background: #555555; transform: translateY(-2px); }
        .social-icon svg { width: 16px; height: 16px; fill: currentColor; }

        @media (max-width: 900px) {
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 25px 25px; }
        }
        @media (max-width: 768px) {
            header { padding: 30px 0 20px 0; }
            nav { gap: 20px; flex-wrap: wrap; }
            .page-wrapper { padding: 25px 0 60px 0; }
            .games-grid { padding-top: 40px; }
            .footer-content { flex-direction: column; gap: 15px; text-align: center; }
        }
        @media (max-width: 600px) {
            .games-grid { grid-template-columns: 1fr; gap: 40px; }
        }
    </style>
</head>
