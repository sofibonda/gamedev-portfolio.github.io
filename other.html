<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofya Bandarenka - Other Projects</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; color: #333333; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-y: scroll; }
        .container { max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 40px; }
        
        header { background: #f4f4f4; width: 100%; padding: 35px 0 28px 0; border-bottom: 1px solid #e2e2e2; text-align: center; }
        header h1 { font-size: 1.5rem; margin: 0 0 6px 0; font-weight: 500; letter-spacing: -0.3px; color: #111111; }
        header .subtitle { color: #888888; font-size: 0.85rem; margin: 0 0 24px 0; letter-spacing: 0.5px; font-weight: 400; }
        
        nav { display: flex; justify-content: center; gap: 35px; }
        nav a { text-decoration: none; color: #888888; font-size: 1.1rem; font-weight: 400; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: color 0.2s ease, border-color 0.2s ease; }
        nav a.active, nav a:hover { color: #111111; border-color: #111111; }
        
        main { flex: 1; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .page-wrapper { max-width: 1000px; width: 100%; padding: 25px 0 120px 0; display: flex; flex-direction: column; align-items: center; position: relative; margin: 0 auto; }
        
        /* Сетка в 3 колонки */
        .other-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 30px; width: 100%; padding-top: 20px; }
        
        /* КАРТОЧКА ПРОЕКТА - СТИЛЬ ОДИН В ОДИН КАК В GAMES */
        .project-card { 
            text-decoration: none; 
            color: inherit; 
            display: flex; 
            flex-direction: column; 
            text-align: center; 
            background-color: #f7f7f7; 
            border: 1px solid #e0e2e5;  
            border-radius: 14px;       
            overflow: hidden;          
            -webkit-backface-visibility: hidden;
            -moz-backface-visibility: hidden;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease; 
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04); 
        }
        .project-card:hover { 
            transform: translateY(-5px); 
            border-color: #b5b5b5; 
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08); 
        }
        
        /* Медиабокс внутри карточки */
        .project-media-box { 
            width: 100%; 
            aspect-ratio: 4 / 3; 
            overflow: hidden; 
            background-color: #fafafa; 
            border-bottom: 1px solid #e0e2e5; 
            position: relative; 
        }
        .project-media-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Текстовая зона карточки */
        .project-info { 
            padding: 20px 14px 22px 14px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .project-title { font-size: 1.1rem; font-weight: 600; color: #111111; margin: 0; line-height: 1.3; letter-spacing: -0.2px; }

        /* Изящная подчёркнутая ссылка внизу карточки */
        .project-btn {
            font-size: 0.85rem;
            font-weight: 500;
            color: #888888;
            border-bottom: 1px dashed #b5b5b5; 
            padding-bottom: 1px;
            margin-top: 2px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .project-card:hover .project-btn { color: #000000; border-color: #000000; }

        /* ФУТЕР */
        footer { background: #e5e5e5; color: #555555; padding: 25px 0; font-size: 0.85rem; width: 100%; margin-top: auto; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; }
        .footer-left { font-weight: 400; color: #666666; }
        .footer-right { display: flex; align-items: center; gap: 15px; }
        .footer-right span { font-weight: 500; color: #333333; margin-right: 5px; letter-spacing: 0.3px; }
        .social-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #222222; border-radius: 50%; color: #ffffff; transition: background 0.2s ease, transform 0.2s ease; text-decoration: none; }
        .social-icon:hover { background: #555555; transform: translateY(-2px); }
        .social-icon svg { width: 16px; height: 16px; fill: currentColor; }

        @media (max-width: 820px) { .other-grid { grid-template-columns: repeat(2, 1fr); gap: 30px; } }
        @media (max-width: 580px) { .other-grid { grid-template-columns: 1fr; gap: 35px; } header { padding: 30px 0 20px 0; } nav { gap: 20px; flex-wrap: wrap; } .page-wrapper { padding: 25px 20px 60px 20px; } .footer-content { flex-direction: column; gap: 15px; text-align: center; } }
    </style>
</head>
